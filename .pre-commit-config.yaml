repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep in sync with the ruff version in uv.lock.
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.0
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
  - repo: local
    hooks:
      - id: no-em-dash
        name: no em dash (U+2014)
        language: pygrep
        # UTF-8 bytes of U+2014 (pygrep uses a bytes regex); this file never contains the character.
        entry: '\xe2\x80\x94'
        # Text only: the bytes occur by chance inside binary files such as woff2 fonts.
        types: [text]
        exclude: ^uv\.lock$

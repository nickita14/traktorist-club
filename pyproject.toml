[project]
name = "traktorist-club"
version = "0.1.0"
description = "Club poker tracker"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "Django>=6.0,<7.0",
    "django-axes>=8.3.1",
    "django-environ>=0.12.0",
    "django-otp>=1.7.3",
    "django-tailwind-cli>=4.0.0",
    "django-unfold>=0.108.0",
    "gunicorn>=26.2.0",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.2.0",
    "pyyaml>=6.0.3",
    "qrcode>=8.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-django>=4.9.0",
    "ruff>=0.16.9",
    "pre-commit>=4.0.0",
    "playwright>=1.63.0",
    "coverage>=7.16.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "traktorist_club.settings"
pythonpath = ["src"]
python_files = ["tests.py", "test_*.py"]
addopts = "-ra --strict-markers"
markers = [
    # Set by conftest.py on every test that uses the `browser` fixture.
    "browser: renders pages in headless Chromium (Playwright); skipped when it is not installed",
]

# The unit job's report for Sonar: `coverage run -m pytest -m "not browser"`, then `coverage xml`.
[tool.coverage.run]
source = ["src"]
branch = true
# Repository-relative paths in coverage.xml: Sonar reads it in another job's checkout.
relative_files = true
omit = ["*/tests/*", "*/migrations/*"]

[tool.coverage.xml]
output = "coverage.xml"

[tool.ruff]
line-length = 100
target-version = "py313"
src = [".", "src"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

[tool.ruff.lint.isort]
known-first-party = ["club", "importer", "live", "traktorist_club"]

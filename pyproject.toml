[project]
name = "traktorist-club"
version = "0.1.0"
description = "Club poker tracker"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "Django>=6.0,<7.0",
    "django-environ>=0.12.0",
    "django-tailwind-cli>=4.0.0",
    "django-unfold>=0.108.0",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.2.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-django>=4.9.0",
    "ruff>=0.16.9",
    "pre-commit>=4.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "traktorist_club.settings"
python_files = ["tests.py", "test_*.py"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

[tool.ruff.lint.isort]
known-first-party = ["club", "importer", "traktorist_club"]

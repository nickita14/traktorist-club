{# The tractor wheel motif: a tyre, the rim, four spokes, the hub. Decorative. #}

  <circle class="poster-wheel-tyre" cx="100" cy="100" r="96"/>
  <circle class="poster-wheel-rim" cx="100" cy="100" r="70"/>
  <g class="poster-wheel-spokes">
    <line x1="100" y1="34" x2="100" y2="166"/>
    <line x1="34" y1="100" x2="166" y2="100"/>
    <line x1="53" y1="53" x2="147" y2="147"/>
    <line x1="147" y1="53" x2="53" y2="147"/>
  </g>
  <circle class="poster-wheel-hub" cx="100" cy="100" r="22"/>
</svg>

<aside aria-labelledby="recent-title">
  <h2 id="recent-title" class="font-head text-lg font-bold tracking-label uppercase">{% if season.kind == "cash" %}Последние вечера{% else %}Последние игры{% endif %}</h2>
  {% if recent_games %}
    {% include "club/includes/games_table.html" with games=recent_games compact=True %}
    <p class="doc-pager mt-2"><a class="next" href="{% url 'season_games' season.year season.kind %}">Все игры сезона →</a></p>
  {% else %}
    <p class="mt-2 text-muted italic">Игр пока нет.</p>
  {% endif %}
</aside>

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: traktorist_club
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # Local only: do not expose the dev database to the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d traktorist_club"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

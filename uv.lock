version = "0.1.0"
source = { virtual = "." }
dependencies = [
    { name = "django" },
    { name = "django-environ" },
    { name = "django-tailwind-cli" },
    { name = "django-unfold" },
    { name = "openpyxl" },
    { name = "psycopg", extra = ["binary"] },
    { name = "pyyaml" },
]

[package.dev-dependencies]
dev = [
    { name = "pre-commit" },
    { name = "pytest" },
    { name = "pytest-django" },
    { name = "ruff" },
]

[package.metadata]
requires-dist = [
    { name = "django", specifier = ">=6.0,<7.0" },
    { name = "django-environ", specifier = ">=0.12.0" },
    { name = "django-tailwind-cli", specifier = ">=4.0.0" },
    { name = "django-unfold", specifier = ">=0.108.0" },
    { name = "openpyxl", specifier = ">=3.1.5" },
    { name = "psycopg", extras = ["binary"], specifier = ">=3.2.0" },
    { name = "pyyaml", specifier = ">=6.0.3" },
]

[package.metadata.requires-dev]
dev = [
    { name = "pre-commit", specifier = ">=4.0.0" },
    { name = "pytest", specifier = ">=8.3.0" },
    { name = "pytest-django", specifier = ">=4.9.0" },
    { name = "ruff", specifier = ">=0.16.9" },
]


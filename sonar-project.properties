# SonarQube Cloud analysis, run by the sonar job in .github/workflows/ci.yml (advisory).
sonar.organization=nickita14
sonar.projectKey=nickita14_traktorist-club
sonar.python.version=3.13

# The Django code is in src/; the tests live inside the apps (src/club/tests/ and so on). They
# are analyzed as tests, so they count for neither coverage nor duplication.
sonar.sources=src
sonar.tests=src
sonar.exclusions=src/**/tests/**
sonar.test.inclusions=src/**/tests/**

# Generated migrations: no coverage expected, and their repetition is not duplication.
sonar.coverage.exclusions=src/**/migrations/**
sonar.cpd.exclusions=src/**/migrations/**

# Written by the unit job (coverage xml, paths relative to the repository root).
sonar.python.coverage.reportPaths=coverage.xml

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: traktorist_club
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d traktorist_club"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DEBUG: "True"
      ENVIRONMENT: "development"
      SECRET_KEY: test-secret-key-for-ci-with-a-long-random-value-1234567890
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/traktorist_club
      ADMIN_URL: club-admin/

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Compile translations
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gettext
          uv run python manage.py compilemessages --ignore=.venv

      - name: Build Tailwind CSS
        # assets/css/tailwind.css is gitignored; without it the browser tests measure unstyled pages.
        run: uv run python manage.py tailwind build

      - name: Install Chromium for browser tests
        run: uv run playwright install --with-deps chromium

      - name: Run pytest
        env:
          # Browser tests skip locally without Chromium, the translation test without compiled
          # .mo files; in CI either one missing is a failure.
          REQUIRE_BROWSER_TESTS: "1"
          REQUIRE_COMPILED_MESSAGES: "1"
        run: uv run pytest -v

      - name: Django deployment check
        env:
          DEBUG: "False"
          ENVIRONMENT: "production"
          SECRET_KEY: production-test-secret-key-for-deploy-check-q8Zr2mXv7LpN4wTk9HsB
          ALLOWED_HOSTS: club.example.com
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/traktorist_club
          ADMIN_URL: hq-7f3k/
        run: uv run python manage.py check --deploy --fail-level WARNING

  docker-image:
    # The production image must build (Tailwind, compilemessages, collectstatic) and refuse to run
    # outside production mode.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the production image
        run: docker build -t traktorist-web:ci .

      - name: Refuses to start in development mode
        run: |
          if docker run --rm -e ENVIRONMENT=development traktorist-web:ci; then
            echo "The image started with ENVIRONMENT=development" >&2
            exit 1
          fi

  deploy:
    # Pushes to main only, after both jobs above pass: pull requests (Dependabot's and forks'
    # included) never get here, and a fork's own main skips it. It deploys the tested commit
    # (github.sha) through the CI key, whose forced command on the server (deploy/ci-deploy.sh)
    # accepts a commit SHA of main and nothing else. Setup: docs/deploy.md, section 12.
    needs: [lint-and-test, docker-image]
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && github.repository == 'nickita14/traktorist-club'
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    # A hung build or connection fails the job instead of holding the deploy lock for hours.
    timeout-minutes: 30
    environment:
      name: production
      url: https://traktorist.duckdns.org/
    # Deploys queue one after another; a running one is never cancelled. (GitHub keeps one
    # pending run per group: a newer push replaces a waiting one, so the latest main wins.)
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      DEPLOY_HOST: deploy@traktorist.duckdns.org
      DEPLOY_DOMAIN: traktorist.duckdns.org
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install the CI key and the pinned host key
        # Secrets reach the script only through env, never interpolated into it.
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [[ -z $DEPLOY_SSH_KEY || -z $DEPLOY_KNOWN_HOSTS ]]; then
            echo "::error::DEPLOY_SSH_KEY or DEPLOY_KNOWN_HOSTS is missing in the production environment"
            exit 1
          fi
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/ci_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/ci_known_hosts"

      - name: Deploy the tested commit
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          ssh -i "$HOME/.ssh/ci_key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/ci_known_hosts" \
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "$DEPLOY_HOST" "$DEPLOY_SHA"

      - name: Smoke check
        run: deploy/smoke-check.sh "$DEPLOY_DOMAIN"

      - name: Remove the key
        if: always()
        run: rm -f "$HOME/.ssh/ci_key" "$HOME/.ssh/ci_known_hosts"

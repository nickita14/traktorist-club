name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: traktorist_club
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d traktorist_club"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DEBUG: "True"
      ENVIRONMENT: "development"
      SECRET_KEY: test-secret-key-for-ci-with-a-long-random-value-1234567890
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/traktorist_club
      ADMIN_URL: club-admin/

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Run pytest
        run: uv run pytest -v

      - name: Django deployment check
        env:
          DEBUG: "False"
          ENVIRONMENT: "production"
          SECRET_KEY: production-test-secret-key-for-deploy-check-q8Zr2mXv7LpN4wTk9HsB
          ALLOWED_HOSTS: club.example.com
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/traktorist_club
          ADMIN_URL: hq-7f3k/
        run: uv run python manage.py check --deploy --fail-level WARNING

# /etc/ssh/sshd_config.d/00-hardening.conf
# Key-only SSH for the deploy user. Named 00- so it is read before Ubuntu's 50-cloud-init.conf,
# which may turn password login back on: for most options sshd keeps the first value it reads.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
PubkeyAuthentication yes
AllowUsers deploy
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
